{% extends "layout.html" %}

{% block content %}
<style>
  /* === Glassmorphism + Green Theme === */
  .glass-card {
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
  }

  .glass-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0, 128, 0, 0.15);
  }

  /* Input styles */
  .form-input, .form-select {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 1.25rem;
    border: 1.5px solid rgba(22, 163, 74, 0.4); /* green border */
    background: rgba(255, 255, 255, 0.7);
    color: #1b4332;
    font-size: 0.95rem;
    transition: all 0.25s ease;
    box-sizing: border-box;
  }

  .form-input:focus,
  .form-select:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.3);
    background: rgba(255, 255, 255, 0.95);
  }

  /* Label */
  label {
    color: #14532d;
    font-weight: 500;
  }

  /* Buttons */
  .btn-green {
    background-color: #16a34a;
    color: white;
    border: none;
    border-radius: 9999px; /* fully rounded */
    padding: 0.55rem 1.4rem;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    white-space: nowrap;
  }

  .btn-green:hover {
    background-color: #15803d;
    transform: scale(1.05);
  }

  /* Back link */
  .back-link {
    color: #16a34a;
    transition: color 0.2s ease;
  }

  .back-link:hover {
    color: #15803d;
    text-decoration: underline;
  }

  /* Checkbox */
  input[type="checkbox"] {
    accent-color: #16a34a;
  }

  /* Container animation */
  .fade-in {
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="container mx-auto p-6 max-w-2xl fade-in">
  <!-- Glass Card Wrapper -->
  <div class="glass-card p-6 rounded-2xl shadow-md">
    <h3 class="text-2xl font-bold text-green-700 mb-6 text-center">
      <i class="bi bi-person-fill-add text-green-600"></i> Add New Employee
    </h3>

    <form method="POST">
      <!-- First Name -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">First Name</label>
        <input 
          type="text" 
          name="first_name" 
          class="form-input"
          placeholder="Enter first name"
          required
        >
      </div>

      <!-- Last Name -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">Last Name</label>
        <input 
          type="text" 
          name="last_name" 
          class="form-input"
          placeholder="Enter last name"
          required
        >
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">Email</label>
        <input 
          type="email" 
          name="email" 
          class="form-input"
          placeholder="Enter email"
          required
        >
      </div>

      <!-- Phone Number -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">Phone Number</label>
        <input 
          type="tel" 
          name="phone_number" 
          class="form-input"
          placeholder="e.g. +254712345678"
        >
      </div>

      <!-- Role -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">Role</label>
        <select 
          name="role" 
          class="form-select"
          required
        >
          <option value="">Select Role</option>
          <option value="Driver">Driver</option>
          <option value="ProductManager">Product Manager</option>
          <option value="Admin">Admin</option>
          <option value="Financer">Financer</option>
          <option value="CustomerService">Customer Service</option>
        </select>
      </div>

      <!-- Location -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">Location</label>
        <input 
          type="text" 
          name="location" 
          class="form-input"
          placeholder="Enter location (e.g., HQ, Nairobi)"
          required
        >
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="block text-sm mb-1.5">Password</label>
        <input 
          type="password" 
          name="password" 
          class="form-input"
          placeholder="Create a password"
          required
        >
      </div>

      <!-- Generate OTP Checkbox -->
      <div class="mb-5 flex items-center">
        <input 
          type="checkbox" 
          name="generate_otp" 
          id="generate_otp"
          class="mr-2 h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500"
        >
        <label for="generate_otp" class="text-sm font-medium text-gray-700">
          Generate OTP for this employee
        </label>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-center">
        <button type="submit" class="btn-green font-medium">
          <i class="bi bi-person-plus"></i> Add Employee
        </button>
      </div>
    </form>

    <!-- Back Link -->
    <div class="text-center mt-5">
      <a href="{{ url_for('employees.employees_home') }}" class="back-link text-sm font-medium">
        ← Back to Employee List
      </a>
    </div>
  </div>
</div>
{% endblock %}
