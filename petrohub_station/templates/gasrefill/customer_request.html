{% extends "base2.html" %}
{% block content %}
<div class="container mt-5">
  <div class="glass-card p-4 mx-auto" style="max-width: 600px;">
    <h2 class="mb-4 text-center"> Request Gas Refill</h2>
    <form method="POST" novalidate>
      <!-- Cylinder Type -->
      <div class="mb-3">
        <label for="cylinder_type" class="form-label">Cylinder Type</label>
        <select name="cylinder_type" id="cylinder_type" class="form-select" required>
          <option value="">Select Type</option>
          {% for cyl in cylinders %}
            <optgroup label="{{ cyl.type }}">
              {% for size in cyl.sizes %}
                <option value="{{ cyl.type }}">{{ size }}</option>
              {% endfor %}
            </optgroup>
          {% endfor %}
        </select>
        <input type="hidden" name="size" id="selectedSize">
      </div>

      <!-- Location -->
      <div class="mb-3">
        <label for="location" class="form-label">Delivery Location</label>
        <select name="location" id="location" class="form-select" required>
          <option value="">Select Area</option>
          {% for loc in locations %}
            <option value="{{ loc }}">{{ loc }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Special Instructions -->
      <div class="mb-3">
        <label for="instructions" class="form-label">Special Instructions (e.g., Gate code, Doorbell, etc.)</label>
        <textarea name="instructions" id="instructions" class="form-control" rows="3" placeholder="e.g., 'Red door, ring bell twice'"></textarea>
      </div>

      <button type="submit" class="btn btn-glass btn-order w-100">Request Refill</button>
    </form>
    <p class="mt-3 text-center">
      <a href="{{ url_for('shop.shop_home') }}" class="text-muted small">← Back to Shop</a>
    </p>
  </div>
</div>

<script>
  document.querySelector('select[name="cylinder_type"]').addEventListener('change', function() {
    const selected = this.options[this.selectedIndex];
    if (selected && selected.text && selected.text.includes('kg')) {
      document.getElementById('selectedSize').value = selected.text;
    }
  });
</script>
{% endblock %}
